          description: Fecha de negocio en formato YYYY-MM-DD. Opcional (por defecto
            hoy).
        shift:
          allOf:
          - $ref: '#/components/schemas/ShiftEnum'
          default: MATUTINO
          description: |-
            Turno escolar. Relevante únicamente para check_student_absences.

            * `MATUTINO` - Matutino
            * `VESPERTINO` - Vespertino
        confirm_school_day:
          type: boolean
          description: Confirmación explícita del Administrador de que la fecha fue
            día lectivo (D-03).
      required:
      - confirm_school_day
    SexEnum:
      enum:
      - M
      - F
      type: string
      description: |-
        * `M` - Masculino
        * `F` - Femenino
    ShiftEnum:
      enum:
      - MATUTINO
      - VESPERTINO
      type: string
      description: |-
        * `MATUTINO` - Matutino
        * `VESPERTINO` - Vespertino
    StudentGuardian:
      type: object
      description: |-
        Serializa la relación Student–Guardian con datos del tutor inline.

        Attributes:
            guardian: Datos completos del tutor (read-only).
            relationship_display: Etiqueta legible del parentesco.
            consent_status_display: Etiqueta legible del consentimiento.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Identificador único universal (UUIDv4)
        guardian:
          allOf:
          - $ref: '#/components/schemas/Guardian'
          readOnly: true
        relationship:
          allOf:
          - $ref: '#/components/schemas/RelationshipEnum'
          title: Parentesco
        relationship_display:
          type: string
          readOnly: true
        is_primary_contact:
          type: boolean
          title: ¿Es contacto principal?
        is_valid_contact:
          type: boolean
          title: ¿Contacto válido?
          description: False si el email/teléfono fue invalidado manualmente (RN-EST-11).
        consent_status:
          allOf:
          - $ref: '#/components/schemas/StudentGuardianConsentStatusEnum'
          title: Estado de consentimiento
          description: |-
            RN-EST-07. Default PENDIENTE al crear.

            * `PENDIENTE` - Pendiente
            * `OTORGADO` - Otorgado
            * `REVOCADO` - Revocado
        consent_status_display:
          type: string
          readOnly: true
        linked_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha/hora de alta del vínculo
          description: 'Hallazgo C-3 (v3.2): base del primer renglón de GuardianConsentLog.'
      required:
      - consent_status_display
      - guardian
      - id
      - linked_at
      - relationship_display
    StudentGuardianConsentStatusEnum:
      enum:
      - PENDIENTE
      - OTORGADO
      - REVOCADO
      type: string
      description: |-
        * `PENDIENTE` - Pendiente
        * `OTORGADO` - Otorgado
        * `REVOCADO` - Revocado
    StudentRead:
      type: object
      description: |-
        Serializador de lectura del expediente de estudiante (§2.4).

        Expone display_name, sort_name, academic_group y el estado del
        QR activo. Los campos sensibles (blood_type, allergies,
        has_payment_debt) se incluyen o excluyen según el rol del
        solicitante (RN-EST-12); el filtrado lo aplica la vista.

        Attributes:
            display_name: Nombre calculado para la UI (RN-TRX-10).
            sort_name: Nombre para ordenamiento (RN-TRX-10).
            academic_group: Representación legible de grado/grupo/turno.
            status_display: Etiqueta legible del estado.
            completeness_display: Etiqueta legible de completitud.
            active_qr_token_id: UUID del QR vigente o null.
            guardians: Lista de vínculos Estudiante–Tutor.
            consent_warning: True si algún tutor está PENDIENTE o REVOCADO (RN-EST-08).
            photo_url: Ruta interna de la API, nunca URL pública (RN-TRX-02).
