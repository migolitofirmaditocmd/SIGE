          description: |-
            Lista los campos faltantes que hacen el expediente INCOMPLETO (RN-EST-10).

            Args:
                obj: Instancia de Student.

            Returns:
                list[str]: Nombres de campos faltantes.
          readOnly: true
        birth_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          title: Fecha de nacimiento
        sex:
          readOnly: true
          nullable: true
          title: Sexo
          oneOf:
          - $ref: '#/components/schemas/SexEnum'
          - $ref: '#/components/schemas/NullEnum'
        photo_url:
          type: string
          readOnly: true
          nullable: true
          title: Ruta interna de fotografía
          description: Ruta privada; nunca una URL pública (RN-TRX-02).
        address_street:
          type: string
          readOnly: true
          nullable: true
          title: Calle y número
        address_colonia:
          type: string
          readOnly: true
          nullable: true
          title: Colonia
        address_municipio:
          type: string
          readOnly: true
          nullable: true
          title: Municipio
        address_estado:
          type: string
          readOnly: true
          nullable: true
          title: Estado
        address_postal_code:
          type: string
          readOnly: true
          nullable: true
          title: Código postal
        blood_type:
          type: string
          readOnly: true
          nullable: true
          title: Tipo de sangre
          description: Restringido a ADM, PRE, PAD (RN-EST-12).
        allergies:
          type: string
          readOnly: true
          nullable: true
          title: Alergias o consideraciones médicas
          description: Restringido a ADM, PRE, PAD (RN-EST-12).
        has_payment_debt:
          type: boolean
          readOnly: true
          nullable: true
          title: ¿Tiene adeudo de pago?
          description: Solo visible a ADM y PAD (RN-EST-12). Sin monto.
        guardians:
          type: array
          items:
            $ref: '#/components/schemas/StudentGuardian'
          readOnly: true
        consent_warning:
          type: boolean
          description: |-
            True si algún tutor tiene consentimiento PENDIENTE o REVOCADO.

            Args:
                obj: Instancia de Student.

            Returns:
                bool: True si se requiere atención en el consentimiento (RN-EST-08).
          readOnly: true
        active_qr_token_id:
          type: string
          nullable: true
          description: |-
            Retorna el UUID del QR vigente o None.

            Args:
                obj: Instancia de Student.

            Returns:
                str | None: UUID como cadena o None si no hay QR vigente.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de creación
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Última actualización
      required:
      - academic_group
      - active_qr_token_id
      - address_colonia
      - address_estado
      - address_municipio
      - address_postal_code
      - address_street
      - allergies
      - birth_date
      - blood_type
      - completeness
      - completeness_display
      - consent_warning
      - created_at
      - curp
      - display_name
      - enrollment_id
      - first_name
      - grade
      - group_letter
      - guardians
