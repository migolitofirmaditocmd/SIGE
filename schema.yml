        id:
          type: string
          format: uuid
          readOnly: true
          description: Identificador único universal (UUIDv4)
        enrollment_id:
          type: string
          readOnly: true
          title: Matrícula / Código escolar
        curp:
          type: string
          readOnly: true
          nullable: true
          title: CURP Oficial (RENAPO)
        first_name:
          type: string
          readOnly: true
          title: Nombre(s)
        last_name_father:
          type: string
          readOnly: true
          title: Apellido paterno
        last_name_mother:
          type: string
          readOnly: true
          nullable: true
          title: Apellido materno
          description: Opcional. Vacío se guarda como NULL (nunca cadena vacía).
        display_name:
          type: string
          readOnly: true
        sort_name:
          type: string
          readOnly: true
        grade:
          readOnly: true
          nullable: true
          title: Grado escolar
          oneOf:
          - $ref: '#/components/schemas/GradeEnum'
          - $ref: '#/components/schemas/NullEnum'
        group_letter:
          allOf:
          - $ref: '#/components/schemas/GroupLetterEnum'
          readOnly: true
          title: Grupo (letra)
        shift:
          allOf:
          - $ref: '#/components/schemas/ShiftEnum'
          readOnly: true
          title: Turno
        academic_group:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StudentReadStatusEnum'
          readOnly: true
          title: Estado escolar
        status_display:
          type: string
          readOnly: true
        completeness:
          type: string
          readOnly: true
          title: Completitud del expediente
          description: Calculado automáticamente. INCOMPLETO si falta birth_date o
            photo_url.
        completeness_display:
          type: string
          readOnly: true
        missing_fields:
          type: array
          items:
