openapi: 3.0.3
info:
  title: SIGE API
  version: 1.0.0
  description: 'Sistema Integral de Gestión Escolar — Escuela Secundaria Mixta 5.
    API REST v1. Especificación: SIGE_Especificacion_API_REST_v2.md'
paths:
  /api/v1/credentials/exports/:
    post:
      operationId: credentials_export_download
      description: Genera y entrega el documento de credenciales para impresión (RF-CRE-01,
        RF-CRE-02).
      summary: Descargar credenciales o stickers (PDF/PNG)
      tags:
      - Identificación y Credenciales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialExportDownloadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CredentialExportDownloadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CredentialExportDownloadRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/credentials/exports/preview/:
    post:
      operationId: credentials_export_preview
      description: Evalúa los candidatos y lista a los incluidos y excluidos con su
        motivo (RN-CRE-01).
      summary: Vista previa de exportación de credenciales
      tags:
      - Identificación y Credenciales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialExportPreviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CredentialExportPreviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CredentialExportPreviewRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialExportPreviewResponse'
          description: ''
  /api/v1/credentials/tokens/:
    post:
      operationId: credentials_issue_token
      description: Genera un nuevo token criptográfico opaco y revoca el anterior
        si existía (RN-QR-01, RN-QR-03).
      summary: Emitir o renovar código QR de credencial
      tags:
      - Identificación y Credenciales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialTokenIssueRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CredentialTokenIssueRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CredentialTokenIssueRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialTokenIssueResponse'
          description: ''
  /api/v1/ops/jobs/{job_name}/run/:
    post:
      operationId: ops_jobs_run_create
      description: Ejecuta de forma manual e idempotente un background job (check_student_absences
        o check_teacher_absences). Requiere confirm_school_day=True; de lo contrario
        responde 422 VALIDATION_ERROR. Queda auditado en AUDIT_LOG con origin='MANUAL'
        y el usuario autenticado.
      summary: Ejecutar manualmente un proceso programado (ADM)
      parameters:
      - in: path
        name: job_name
        schema:
          type: string
        required: true
      tags:
      - ops
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunJobRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RunJobRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RunJobRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRun'
          description: Resultado del JOB_RUN
        '400':
          description: Parámetros inválidos o formato erróneo
        '403':
          description: Permiso denegado (requiere rol Administrador)
        '422':
          description: Violación de regla de negocio o confirm_school_day ausente
  /api/v1/qr/{token}/image/:
    get:
      operationId: qr_render_image
      description: Retorna el PNG binario del código QR de la credencial.
      summary: Renderizar imagen PNG de código QR
      parameters:
      - in: query
        name: high_res
        schema:
          type: boolean
        description: Generar en alta resolución para credencial impresa
      - in: path
        name: token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Códigos QR
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            image/png:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/qr/issue/:
    post:
      operationId: qr_issue_token
      description: Genera un nuevo token QR firmado con HMAC-SHA256 y revoca el anterior
        si existía.
      summary: Emitir o renovar credencial QR
      tags:
      - Códigos QR
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRIssueRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QRIssueRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QRIssueRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRIssueResponse'
          description: ''
  /api/v1/qr/validate/:
    post:
      operationId: qr_validate
      description: Resuelve y valida un código QR escaneado por prefectura o docentes.
      summary: Validar token QR escaneado
      tags:
      - Códigos QR
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRValidateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QRValidateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QRValidateRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRValidateResponse'
          description: ''
  /api/v1/students/:
    get:
      operationId: students_list
      description: Lista estudiantes con filtros de grado, grupo, turno, estatus y
        búsqueda por texto.
      summary: Listado paginado y búsqueda de estudiantes
      parameters:
      - in: query
        name: grade
        schema:
          type: integer
        description: Grado escolar (1, 2, 3)
      - in: query
        name: group
        schema:
          type: string
        description: Letra de grupo (A–F)
      - in: query
        name: page
        schema:
          type: integer
        description: Número de página
      - in: query
        name: page_size
        schema:
          type: integer
        description: Tamaño de página (máx. 100)
      - in: query
        name: search
        schema:
          type: string
        description: Búsqueda en nombre, matrícula y CURP
      - in: query
        name: shift
        schema:
          type: string
        description: Turno (MATUTINO, VESPERTINO)
      - in: query
        name: status
        schema:
          type: string
        description: Estatus (ACTIVO, BAJA, EGRESADO)
      tags:
      - Estudiantes
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudentReadList'
          description: ''
    post:
      operationId: students_create
      description: Crea un expediente de estudiante y sus tutores legales asociados
        en una sola transacción.
      summary: Crear estudiante con tutores
      tags:
      - Estudiantes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentWriteRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentRead'
          description: ''
  /api/v1/students/{id}/:
    get:
      operationId: students_detail
      description: |-
        Devuelve el expediente completo del estudiante (§2.4).

        Args:
            request: Request HTTP GET.
            pk: UUID del estudiante.

        Returns:
            Response: Expediente con datos y vínculos de tutores.
      summary: Expediente completo de un estudiante
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Estudiantes
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentRead'
          description: ''
    patch:
      operationId: students_update
      description: Actualiza datos del estudiante. La matrícula enrollment_id es inmutable
        (RN-EST-02).
      summary: Actualización parcial del expediente
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Estudiantes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStudentWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStudentWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStudentWriteRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentRead'
          description: ''
  /api/v1/students/{id}/guardians/:
    post:
      operationId: students_add_guardian
      description: Vincula un tutor existente o crea uno nuevo para el alumno (RN-EST-03,
        RN-EST-13).
      summary: Vincular tutor legal a estudiante
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Tutores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardianInlineRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GuardianInlineRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GuardianInlineRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGuardian'
          description: ''
  /api/v1/students/{id}/photo/:
    get:
      operationId: students_download_photo
      description: Descarga autenticada de la fotografía institucional.
      summary: Descargar fotografía del estudiante
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Estudiantes
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoDownloadResponse'
          description: ''
    post:
      operationId: students_upload_photo
      description: Carga de fotografía (JPEG/PNG) para credencialización y expediente
        institucional.
      summary: Cargar fotografía del estudiante
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Estudiantes
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoUploadResponse'
          description: ''
  /api/v1/students/{id}/reinstate/:
    post:
      operationId: students_reinstate
      description: Reincorpora un alumno de BAJA a ACTIVO con motivo obligatorio (RN-EST-06,
        RN-EST-09).
      summary: Reincorporar estudiante (BAJA → ACTIVO)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Estudiantes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentReinstateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentReinstateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentReinstateRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentReinstateResponse'
          description: ''
  /api/v1/students/{id}/status/:
    post:
      operationId: students_change_status
      description: Aplica la transición a BAJA o EGRESADO con motivo obligatorio (RN-EST-04,
        RN-EST-09).
      summary: Baja lógica o egreso de estudiante
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Estudiantes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentStatusRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentStatusResponse'
          description: ''
  /api/v1/students/guardians/{id}/:
    patch:
      operationId: guardians_update
      description: Edita datos del tutor. Si está compartido, requiere confirm=true
        (RN-EST-14).
      summary: Actualizar datos de tutor legal
      parameters:
      - in: query
        name: confirm
        schema:
          type: boolean
        description: Confirmar actualización para tutor compartido
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Tutores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGuardianRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGuardianRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGuardianRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guardian'
          description: ''
  /api/v1/students/student-guardians/{id}/consent/:
    patch:
      operationId: student_guardians_update_consent
      description: Modifica consentimiento y genera renglón de auditoría en GUARDIAN_CONSENT_LOG
        (RN-EST-07).
      summary: Actualizar consentimiento de tutor
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Tutores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConsentUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedConsentUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedConsentUpdateRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentUpdateResponse'
          description: ''
  /api/v1/students/student-guardians/{id}/invalidate-contact/:
    post:
      operationId: student_guardians_invalidate_contact
      description: Marca el contacto como inválido con motivo obligatorio (RN-EST-11).
      summary: Invalidar contacto de tutor
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Tutores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvalidateContactRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvalidateContactRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvalidateContactRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidateContactResponse'
          description: ''
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    ConsentUpdateConsentStatusEnum:
      enum:
      - OTORGADO
      - REVOCADO
      type: string
      description: |-
        * `OTORGADO` - Otorgado
        * `REVOCADO` - Revocado
    ConsentUpdateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        consent_status:
          type: string
        previous_status:
          type: string
          nullable: true
      required:
      - consent_status
      - id
      - previous_status
    CredentialExportDownloadRequest:
      type: object
      description: Serializador para descarga de archivos de credenciales (§2.3).
      properties:
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          default: CREDENCIAL
          description: |-
            Modalidad: CREDENCIAL (requiere foto) o STICKER (solo QR).

            * `CREDENCIAL` - CREDENCIAL
            * `STICKER` - STICKER
        entity_type:
          allOf:
          - $ref: '#/components/schemas/EntityTypeEnum'
          default: STUDENT
          description: |-
            Tipo de entidad a exportar.

            * `STUDENT` - STUDENT
            * `TEACHER` - TEACHER
        entity_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Lista de identificadores para exportación selectiva.
        group_id:
          type: string
          nullable: true
          minLength: 1
          description: Identificador de grupo escolar para exportación masiva.
        format:
          allOf:
          - $ref: '#/components/schemas/FormatEnum'
          default: PDF
          description: |-
            Formato de exportación: PDF (lote o individual) o PNG (individual).

            * `PDF` - PDF
            * `PNG` - PNG
    CredentialExportPreviewRequest:
      type: object
      description: Serializador para solicitud de vista previa de exportación (§2.3).
      properties:
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          default: CREDENCIAL
          description: |-
            Modalidad: CREDENCIAL (requiere foto) o STICKER (solo QR).

            * `CREDENCIAL` - CREDENCIAL
            * `STICKER` - STICKER
        entity_type:
          allOf:
          - $ref: '#/components/schemas/EntityTypeEnum'
          default: STUDENT
          description: |-
            Tipo de entidad a exportar.

            * `STUDENT` - STUDENT
            * `TEACHER` - TEACHER
        entity_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Lista de identificadores para exportación selectiva.
        group_id:
          type: string
          nullable: true
          minLength: 1
          description: Identificador de grupo escolar para exportación masiva.
    CredentialExportPreviewResponse:
      type: object
      properties:
        included:
          type: integer
        excluded:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - excluded
      - included
    CredentialTokenIssueRequest:
      type: object
      description: Serializador para emisión y reemplazo de tokens QR (§2.3).
      properties:
        entity_type:
          allOf:
          - $ref: '#/components/schemas/EntityTypeEnum'
          default: STUDENT
          description: |-
            Tipo de persona (STUDENT o TEACHER).

            * `STUDENT` - STUDENT
            * `TEACHER` - TEACHER
        entity_id:
          type: string
          format: uuid
          description: UUID del estudiante o docente titular.
        reason:
          type: string
          default: ''
          description: Motivo de la emisión o reemplazo (obligatorio si ya tiene QR
            vigente).
      required:
      - entity_id
    CredentialTokenIssueResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
          format: uuid
        status:
          type: string
        issued_at:
          type: string
          format: date-time
        entity_id:
          type: string
          format: uuid
        enrollment_id:
          type: string
      required:
      - enrollment_id
      - entity_id
      - issued_at
      - message
      - status
      - token
    EntityTypeEnum:
      enum:
      - STUDENT
      - TEACHER
      type: string
      description: |-
        * `STUDENT` - STUDENT
        * `TEACHER` - TEACHER
    FormatEnum:
      enum:
      - PDF
      - PNG
      type: string
      description: |-
        * `PDF` - PDF
        * `PNG` - PNG
    GradeEnum:
      enum:
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `1` - 1°
        * `2` - 2°
        * `3` - 3°
    GroupLetterEnum:
      enum:
      - A
      - B
      - C
      - D
      - E
      - F
      type: string
      description: |-
        * `A` - A
        * `B` - B
        * `C` - C
        * `D` - D
        * `E` - E
        * `F` - F
    Guardian:
      type: object
      description: |-
        Serializador completo de Guardian (lectura y escritura).

        Expone display_name y sort_name calculados (RN-TRX-10).
        El apellido materno vacío se convierte a null (RN-TRX-08).

        Attributes:
            display_name: Nombre(s) Apellido_paterno Apellido_materno.
            sort_name: Apellido_paterno Apellido_materno, Nombre(s).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Identificador único universal (UUIDv4)
        first_name:
          type: string
          title: Nombre(s)
          maxLength: 60
          minLength: 2
        last_name_father:
          type: string
          title: Apellido paterno
          maxLength: 60
          minLength: 2
        last_name_mother:
          type: string
          nullable: true
          title: Apellido materno
          description: Opcional. Vacío se guarda como NULL (nunca cadena vacía).
          maxLength: 60
        display_name:
          type: string
          readOnly: true
        sort_name:
          type: string
          readOnly: true
        email:
          nullable: true
          title: Correo electrónico
          oneOf:
          - type: string
            format: email
            maxLength: 254
