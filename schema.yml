    PatchedGuardianRequest:
      type: object
      description: |-
        Serializador completo de Guardian (lectura y escritura).

        Expone display_name y sort_name calculados (RN-TRX-10).
        El apellido materno vacío se convierte a null (RN-TRX-08).

        Attributes:
            display_name: Nombre(s) Apellido_paterno Apellido_materno.
            sort_name: Apellido_paterno Apellido_materno, Nombre(s).
      properties:
        first_name:
          type: string
          minLength: 2
          title: Nombre(s)
          maxLength: 60
        last_name_father:
          type: string
          minLength: 2
          title: Apellido paterno
          maxLength: 60
        last_name_mother:
          type: string
          nullable: true
          title: Apellido materno
          description: Opcional. Vacío se guarda como NULL (nunca cadena vacía).
          maxLength: 60
        email:
          nullable: true
          title: Correo electrónico
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone_number:
          type: string
          nullable: true
          title: Teléfono celular (10 dígitos)
          maxLength: 10
    PatchedStudentWriteRequest:
      type: object
      description: |-
        Serializador de escritura para POST /api/v1/students/ (§2.4).

        Valida las reglas de negocio:
            - RN-EST-02: enrollment_id único.
            - RN-EST-03/11: mínimo un tutor con is_valid_contact=True.
            - RN-EST-10: datos mínimos para guardar.
            - RN-EST-13: detección de Guardian existente.
            - RN-TRX-08/09: nombres válidos.

        Attributes:
            guardians: Lista de tutores a crear/asociar (obligatorio en POST).
      properties:
        enrollment_id:
          type: string
          minLength: 1
          title: Matrícula / Código escolar
          maxLength: 20
        curp:
          type: string
          nullable: true
          title: CURP Oficial (RENAPO)
          maxLength: 18
        first_name:
          type: string
          minLength: 2
          title: Nombre(s)
          maxLength: 60
        last_name_father:
          type: string
          minLength: 2
          title: Apellido paterno
          maxLength: 60
        last_name_mother:
          type: string
          nullable: true
          title: Apellido materno
          description: Opcional. Vacío se guarda como NULL (nunca cadena vacía).
          maxLength: 60
        grade:
          nullable: true
          title: Grado escolar
          minimum: 0
          maximum: 9223372036854775807
          oneOf:
          - $ref: '#/components/schemas/GradeEnum'
          - $ref: '#/components/schemas/NullEnum'
        group_letter:
          title: Grupo (letra)
          oneOf:
          - $ref: '#/components/schemas/GroupLetterEnum'
          - $ref: '#/components/schemas/BlankEnum'
        shift:
          allOf:
          - $ref: '#/components/schemas/ShiftEnum'
          title: Turno
        birth_date:
          type: string
          format: date
          nullable: true
          title: Fecha de nacimiento
        sex:
          nullable: true
          title: Sexo
          oneOf:
          - $ref: '#/components/schemas/SexEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        address_street:
          type: string
          nullable: true
          title: Calle y número
          maxLength: 200
        address_colonia:
          type: string
          nullable: true
          title: Colonia
          maxLength: 100
        address_municipio:
          type: string
          nullable: true
          title: Municipio
          maxLength: 100
        address_estado:
          type: string
          nullable: true
          title: Estado
          maxLength: 60
        address_postal_code:
          type: string
          nullable: true
          title: Código postal
          maxLength: 5
        blood_type:
          type: string
          nullable: true
          title: Tipo de sangre
          description: Restringido a ADM, PRE, PAD (RN-EST-12).
          maxLength: 5
        allergies:
          type: string
          nullable: true
          title: Alergias o consideraciones médicas
          description: Restringido a ADM, PRE, PAD (RN-EST-12).
        has_payment_debt:
          type: boolean
          nullable: true
          title: ¿Tiene adeudo de pago?
          description: Solo visible a ADM y PAD (RN-EST-12). Sin monto.
        guardians:
          type: array
          items:
            $ref: '#/components/schemas/GuardianInlineRequest'
          writeOnly: true
          description: Al menos un tutor con contacto válido (RN-EST-03/11).
    PhotoDownloadResponse:
