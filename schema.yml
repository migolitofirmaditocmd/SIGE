        Serializador para el modelo JobRun (§3.16).

        Expone los resultados de la ejecución de procesos recurrentes y de fondo.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Identificador único universal (UUIDv4)
        job_name:
          type: string
          readOnly: true
          title: Nombre del proceso
          description: Ej. 'check_student_absences', 'check_teacher_absences'
        run_date:
          type: string
          format: date
          readOnly: true
          title: Fecha de ejecución
        scope:
          type: string
          readOnly: true
          default: GLOBAL
          title: Alcance / Turno
          description: Turno ('MATUTINO'/'VESPERTINO') o 'GLOBAL'
        status:
          allOf:
          - $ref: '#/components/schemas/JobRunStatusEnum'
          readOnly: true
          title: Estado de ejecución
        started_at:
          type: string
          format: date-time
          readOnly: true
          title: Inicio de corrida
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Fin de corrida
        evaluated_count:
          type: integer
          readOnly: true
          nullable: true
          title: Total evaluados
        created_count:
          type: integer
          readOnly: true
          nullable: true
          title: Total creados
        error:
          type: string
          readOnly: true
          nullable: true
