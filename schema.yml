      - OMITIDO
      type: string
      description: |-
        * `EN_CURSO` - En Curso
        * `COMPLETADO` - Completado
        * `FALLIDO` - Fallido
        * `OMITIDO` - Omitido
    ModeEnum:
      enum:
      - CREDENCIAL
